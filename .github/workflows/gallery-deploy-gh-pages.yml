name: Gallery Deploy gh-pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: gallery-deploy-gh-pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  GALLERY_GH_PAGES_PAYLOAD_DIR: .deploy/gh-pages
  GALLERY_WARMUP_SUMMARY_PATH: .deploy/gallery-warmup-summary.md

jobs:
  build:
    name: Prepare validated publication payload
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout current source ref
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify site
        env:
          HAGILIGHT_BUILD_BRANCH: ${{ github.ref_name }}
        run: npm run verify

      - name: Assemble gh-pages publication payload
        run: node scripts/assemble-gh-pages-payload.mjs "$GALLERY_GH_PAGES_PAYLOAD_DIR"

      - name: Upload validated gh-pages payload
        uses: actions/upload-artifact@v4
        with:
          name: gallery-gh-pages-payload
          path: ${{ env.GALLERY_GH_PAGES_PAYLOAD_DIR }}
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    name: Publish validated snapshot to gh-pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    environment:
      name: gallery-production
      url: https://gallery.hagicode.com
    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download validated gh-pages payload
        uses: actions/download-artifact@v4
        with:
          name: gallery-gh-pages-payload
          path: ${{ env.GALLERY_GH_PAGES_PAYLOAD_DIR }}

      - name: Publish validated gh-pages payload
        id: publish-gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./.deploy/gh-pages
          force_orphan: true
          enable_jekyll: false

      - name: Warm deployment domains
        id: warmup
        run: npm run deploy:warmup -- --summary-markdown "$GALLERY_WARMUP_SUMMARY_PATH"

      - name: Summarize deployment output
        if: always()
        env:
          PUBLISH_OUTCOME: ${{ steps.publish-gh-pages.outcome }}
          WARMUP_OUTCOME: ${{ steps.warmup.outcome }}
        run: |
          echo "## Publication status" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publication source: validated build artifact" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`gh-pages\` publication: ${PUBLISH_OUTCOME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Published payload: branch-root \`esa.jsonc\`, \`wrangler.jsonc\`, plus \`dist/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub environment: gallery-production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Expected public URL: https://gallery.hagicode.com" >> "$GITHUB_STEP_SUMMARY"
          echo "- Post-publication warmup: ${WARMUP_OUTCOME}" >> "$GITHUB_STEP_SUMMARY"
          if [ -d "$GALLERY_GH_PAGES_PAYLOAD_DIR" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Payload contents" >> "$GITHUB_STEP_SUMMARY"
            ls -1A "$GALLERY_GH_PAGES_PAYLOAD_DIR" | while read -r entry; do
              echo "- \`${entry}\`" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
          if [ -f "$GALLERY_WARMUP_SUMMARY_PATH" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat "$GALLERY_WARMUP_SUMMARY_PATH" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Deployment domain warmup" >> "$GITHUB_STEP_SUMMARY"
            echo "- Warmup summary file was not created." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$PUBLISH_OUTCOME" = "success" ] && [ "$WARMUP_OUTCOME" = "failure" ]; then
            echo "- Publication note: gh-pages snapshot was already published before warmup verification failed." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$PUBLISH_OUTCOME" = "success" ]; then
            echo "Published the validated gh-pages payload with ./esa.jsonc, ./wrangler.jsonc, and ./dist/."
          else
            echo "Validated gh-pages publication did not complete successfully."
          fi
