name: Gallery CI

on:
  pull_request:
    branches:
      - main

# Read-only: the pull request gate never publishes and never writes to the repository.
permissions:
  contents: read

concurrency:
  group: gallery-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  ci:
    name: Install, check, test and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build and verify site
        run: npm run verify
