name: Gallery CI

on:
  pull_request:
    branches:
      - main

# Read-only: the pull request gate never publishes and never writes to the repository.
permissions:
  contents: read

concurrency:
  group: gallery-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  ci:
    name: Install, check, test and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify install and lockfile stability
        run: |
          test -d node_modules
          git diff --exit-code -- pnpm-lock.yaml

      - name: Registry neutrality
        run: pnpm run check:registry

      - name: Locale audit
        run: pnpm run i18n:check

      - name: Type check
        run: pnpm run check

      - name: Test
        run: pnpm test

      - name: Build and verify site
        run: pnpm run verify
